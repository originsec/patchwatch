[package]
name = "patchwatch"
version = "0.0.1"
edition = "2024"
description = "Local tool for Windows Patch Tuesday CVE ingestion, ghidriff-based binary diffing, and LLM-driven patch analysis."
authors = ["Prelude Research, Inc.", "tyler <tyler@preludesecurity.com>"]
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/originsec/patchwatch"
homepage = "https://github.com/originsec/patchwatch"
keywords = ["windows", "security", "patch-tuesday", "cve", "ghidra"]
categories = ["command-line-utilities"]
publish = false

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "gzip", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
csv = "1.4"
scraper = "0.26"
quick-xml = { version = "0.39", features = ["serialize"] }
flate2 = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
deadpool-sqlite = "0.13"
sha2 = "0.11"
hex = "0.4"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
urlencoding = "2"
dotenvy = "0.15"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
askama = "0.16"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = "5"
chrono = { version = "0.4", features = ["serde"] }
hmac = "0.13"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
